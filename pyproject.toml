[project]
name = "gridmind"
version = "0.1.0"
description = "Autonomous research loop for any domain. Write strategy docs, run experiments while you sleep."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "anthropic>=0.49.0",
    "openai>=1.12.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.3.0"]

[project.scripts]
gridmind = "gridmind.cli:main"

[tool.setuptools.packages.find]
include = ["gridmind*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"
